name: crypto-strategy-lab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_strategy_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_lab}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_lab}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-crypto_lab} -d ${POSTGRES_DB:-crypto_strategy_lab}',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto_lab}:${POSTGRES_PASSWORD:-crypto_lab}@postgres:5432/${POSTGRES_DB:-crypto_strategy_lab}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto_lab}:${POSTGRES_PASSWORD:-crypto_lab}@postgres:5432/${POSTGRES_DB:-crypto_strategy_lab}?schema=public
      BACKEND_HOST: 0.0.0.0
      BACKEND_INSTANCE_ID: ${BACKEND_INSTANCE_ID:-backend-compose-1}
      BACKEND_PORT: 3100
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-key-for-dev}
      SECURE_COOKIE: 'false'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
    ports:
      - '${BACKEND_PORT:-3100}:3100'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backtest-worker:
    build:
      context: .
      dockerfile: apps/backtest-worker/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto_lab}:${POSTGRES_PASSWORD:-crypto_lab}@postgres:5432/${POSTGRES_DB:-crypto_strategy_lab}?schema=public
      WORKER_ID: ${WORKER_ID:-backtest-worker-compose-1}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-3100}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:3100
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
