packages:
  - apps/*
  - packages/*

storeDir: .pnpm-store
injectWorkspacePackages: true

allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': ^24.10.0
  tsx: ^4.21.0
  tsup: ^8.5.0
  typescript: ^5.9.0
  vitest: ^4.1.11
